pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url = uri("https://jitpack.io") }
        maven {
            url = uri("https://repository.kotzilla.io/repository/Koin-Embedded/")

            content {
                includeModule("io.insert-koin", "embedded-koin-core")
                includeModule("io.insert-koin", "embedded-koin-core-jvm")
                includeModule("io.insert-koin", "embedded-koin-android")
            }
        }
    }
}

rootProject.name = "android-dev-tools"
include ':sample'
include ':libraries:analytics-logger'
include ':libraries:analytics-logger-no-op'
include ':libraries:autofill-service'
include ':libraries:debug-menu'
include ':libraries:debug-toast'
include ':libraries:debug-toast-no-op'
include ':libraries:deeplink-launcher'
include ':libraries:environment-manager'
include ':libraries:http-inspector'
include ':libraries:http-inspector-no-op'
include ':libraries:sharedpref-manager'
include ':libraries:view-inspector'
includeBuild("convention-plugins")
